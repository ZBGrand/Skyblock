name: ExplosivePickaxe
version: '${project.version}'
main: com.cupno.explosivepickaxe.ExplosivePickaxe
api-version: 1.18
description: Cup no - dao no mat phang 2x2 / 3x3 / 5x5 / 7x7 / 10x10, khoang san vao kho ExtraStorage
softdepend: [ExtraStorage]
commands:
  cupno:
    description: Enchant cup thanh cup no
    aliases: [explosivepickaxe, ep]
    usage: /cupno <enchant|remove|book|reload>
permissions:
  explosivepickaxe.admin:
    description: Dung lenh enchant / remove / book / reload
    default: op
  explosivepickaxe.use:
    description: Duoc phep dung cup no
    default: true
